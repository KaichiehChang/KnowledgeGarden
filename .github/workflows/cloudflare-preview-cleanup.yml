
name: Cloudflare Preview Cleanup

on:
  pull_request:
    types: [closed]
  delete:

permissions:
  contents: read

jobs:
  cleanup:
    if: >-
      (github.event_name == 'delete' &&
       github.event.ref_type == 'branch') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)

    runs-on: ubuntu-latest
    environment: cloudflare-preview-cleanup

    permissions:
      contents: read
      pull-requests: read

    outputs:
      preview_name: ${{ steps.resolve.outputs.preview_name }}
      cleaned: ${{ steps.remove.outputs.cleaned }}

    steps:
      - name: Resolve Preview name
        id: resolve
        env:
          # Deletion and PR-close events store the source branch in different payload fields.
          SOURCE_BRANCH: ${{ github.event_name == 'delete' && github.event.ref || github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          if [ -z "$SOURCE_BRANCH" ] || [ "$SOURCE_BRANCH" = "main" ]; then
            echo "::error::Invalid source branch"
            exit 1
          fi

          # Keep this normalization and the branch- prefix in sync with
          # cloudflare-preview.yml so cleanup targets the deployed Preview.
          branch_slug="$(printf '%s' "$SOURCE_BRANCH" |
            tr '[:upper:]' '[:lower:]' |
            sed 's/[^a-z0-9-]/-/g')"

          preview_name="branch-${branch_slug}"

          echo "source_branch=$SOURCE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "preview_name=$preview_name" >> "$GITHUB_OUTPUT"

      - name: Check for other open PRs
        id: check
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_BRANCH: ${{ steps.resolve.outputs.source_branch }}
        run: |
          set -euo pipefail

          # PRs from the same branch share a Preview; closing one must not remove
          # the Preview while another PR from that branch is still open.
          open_count="$(gh pr list \
            --repo "$GH_REPO" \
            --state open \
            --head "$SOURCE_BRANCH" \
            --json number \
            --jq 'length')"

          echo "open_count=$open_count" >> "$GITHUB_OUTPUT"

          if [ "$open_count" -gt 0 ]; then
            echo "Preview is still used by another open PR."
          fi

      - name: Setup Node.js
        if: github.event_name == 'delete' || steps.check.outputs.open_count == '0'
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Delete Cloudflare Preview
        id: remove
        if: github.event_name == 'delete' || steps.check.outputs.open_count == '0'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_NAME: ${{ steps.resolve.outputs.preview_name }}
        run: |
          set -euo pipefail

          # Delete only the named Preview, never the Worker itself.
          if output="$(npx --yes wrangler@latest preview delete \
            --worker-name knowledgegarden-preview \
            --name "$PREVIEW_NAME" \
            --skip-confirmation 2>&1)"; then

            printf '%s\n' "$output"
            echo "Preview deleted: $PREVIEW_NAME"
          else
            printf '%s\n' "$output"

            # A second cleanup event may find an already-deleted Preview.
            if grep -Eqi 'Preview not found|code: *10025' <<< "$output"; then
              echo "Preview already absent: $PREVIEW_NAME"
            else
              echo "::error::Cloudflare Preview deletion failed"
              exit 1
            fi
          fi

          echo "cleaned=true" >> "$GITHUB_OUTPUT"
          echo "Cleaned Preview: $PREVIEW_NAME" >> "$GITHUB_STEP_SUMMARY"

  update-pr:
    needs: cleanup
    if: >-
      github.event_name == 'pull_request' &&
      needs.cleanup.outputs.cleaned == 'true'

    runs-on: ubuntu-latest

    permissions:
      issues: write

    steps:
      - name: Mark PR Preview as cleaned
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_NAME: ${{ needs.cleanup.outputs.preview_name }}
        run: |
          set -euo pipefail

          # Shared with cloudflare-preview.yml; update the marker and both
          # workflows' comment lookup filters together.
          marker="<!-- knowledgegarden-preview -->"

          # Find the existing comment created by the deployment workflow.
          comment_id="$(gh api \
            --paginate \
            "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(
              .user.login == "github-actions[bot]" and
              (.body | contains("<!-- knowledgegarden-preview -->"))
            ) | .id' | tail -n 1)"

          if [ -z "$comment_id" ]; then
            echo "No existing Preview comment found."
            exit 0
          fi

          body="$(printf '%s\n\n🧹 **Preview deployment cleaned.**\n\nPreview: `%s`\n\nThe Preview URL is no longer active.' \
            "$marker" "$PREVIEW_NAME")"

          gh api --method PATCH \
            "repos/$GH_REPO/issues/comments/$comment_id" \
            -f body="$body"

          echo "Updated Preview comment on PR #$PR_NUMBER"
