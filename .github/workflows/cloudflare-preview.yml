
name: Cloudflare Preview Deployment

on:
  push:
    branches:
      - "docs/*"
      - "feat/*"
      - "fix/*"
      - "test/*"
      - "refactor/*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    environment: cloudflare-preview

    outputs:
      preview_url: ${{ steps.deploy.outputs.preview_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Build Jekyll website
        working-directory: docs
        run: |
          bundle install
          bundle exec rake build_preview

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Deploy Cloudflare Preview
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Keep this normalization and the branch- prefix in sync with
          # cloudflare-preview-cleanup.yml so cleanup can locate the deployed Preview.
          branch_slug="$(printf '%s' "$GITHUB_REF_NAME" |
            tr '[:upper:]' '[:lower:]' |
            sed 's/[^a-z0-9-]/-/g')"

          preview_name="branch-${branch_slug}"
          output_file="$RUNNER_TEMP/wrangler-preview.ndjson"

          # Deploy and write structured output to a separate file.
          WRANGLER_OUTPUT_FILE_PATH="$output_file" \
            npx --yes wrangler@latest preview --name "$preview_name"

          # Extract the preview URL from the structured output.
          preview_url="$(jq -r \
            'select(.type == "preview") | .preview_urls[0] // empty' \
            "$output_file" | tail -n 1)"

          if [ -z "$preview_url" ]; then
            echo "::error::Preview URL not found in Wrangler output"
            exit 1
          fi

          # Publish the URL to the workflow summary and job output.
          echo "Preview: $preview_url" >> "$GITHUB_STEP_SUMMARY"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"

  comment-preview:
    needs: preview
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Create or update PR preview comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREVIEW_URL: ${{ needs.preview.outputs.preview_url }}
        run: |
          # Find open PRs associated with the current branch.
          pr_numbers="$(gh pr list \
            --repo "$GH_REPO" \
            --state open \
            --head "$GITHUB_REF_NAME" \
            --limit 100 \
            --json number \
            --jq '.[].number')"

          if [ -z "$pr_numbers" ]; then
            echo "No open PR found for branch: $GITHUB_REF_NAME"
            exit 0
          fi

          # Shared with cloudflare-preview-cleanup.yml; update the marker and both
          # workflows' comment lookup filters together.
          marker="<!-- knowledgegarden-preview -->"

          # Keep a single identifiable comment per PR.
          body="$(printf '%s\n\n🌐 **Cloudflare Preview:** %s\n\nCommit: `%s`' \
            "$marker" "$PREVIEW_URL" "$GITHUB_SHA")"

          while IFS= read -r pr_number; do
            echo "Updating preview comment for PR #$pr_number"

            # Find an existing comment created by this workflow.
            comment_id="$(gh api \
              --paginate \
              "repos/$GH_REPO/issues/$pr_number/comments" \
              --jq '.[] | select(
                .user.login == "github-actions[bot]" and
                (.body | contains("<!-- knowledgegarden-preview -->"))
              ) | .id' | tail -n 1)"

            if [ -n "$comment_id" ]; then
              # Update the existing comment instead of creating duplicates.
              gh api --method PATCH \
                "repos/$GH_REPO/issues/comments/$comment_id" \
                -f body="$body"
            else
              # Create the first preview comment for this PR.
              gh api --method POST \
                "repos/$GH_REPO/issues/$pr_number/comments" \
                -f body="$body"
            fi
          done <<< "$pr_numbers"
